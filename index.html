<!DOCTYPE html>
<html>
    <head>
        <Title>
            Escape Classroom
        </Title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            /*img {
                width: 100vw;
                height: 100vh;
                object-fit: contain;
            }*/
            .game-scene {
                width: 100vw;
                height: 100vh;
                /*position: relative;
                width: 100%;
                max-width: 1400px;
                margin: auto;*/
            }
            .game-scene img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .intro {
                width: 100vw;
                height: 100vh;
                background-image: url("intro.jpg");
                background-size: cover;
                background-position: center;
            }
            .scene-image {
                width: 100%;
                height: auto;
                display: block;
            }
            .hotspot {
                position: absolute;
                cursor: pointer;
            }
            /*Solo para desarrollo*/ 
            /*.hotspot{
                position:absolute;
                cursor:pointer;
                border:2px solid yellow;
                background:rgba(255,255,0,.15);
            }*/
            /* Oculta elementos */
            .modal.oculto{
                display:none;
            }
            /* Fondo oscuro */
            .modal{
                position:fixed;
                top:0;
                left:0;
                width:100%;
                height:100%;
                background:rgba(0,0,0,.7);
                display:flex;
                justify-content:center;
                align-items:center;
                z-index:9999;
            }

            /* Ventana */
            .modal-content{
                background:white;
                width:500px;
                max-width:90%;
                padding:25px;
                border-radius:12px;
                box-shadow:0 10px 25px rgba(0,0,0,.3);
                animation:aparecer .3s ease;
            }

            /* Botón cerrar */
            .cerrar{
                float:right;
                font-size:28px;
                font-weight:bold;
                cursor:pointer;
            }

            .cerrar:hover{
                color:red;
            }

            .modal-content h2{
                margin-top:0;
            }

            .modal-content input{
                width:100%;
                padding:10px;
                margin-top:10px;
                margin-bottom:15px;
                box-sizing:border-box;
            }

            .acciones{
                text-align:right;
            }

            .acciones button{
                padding:10px 20px;
                cursor:pointer;
            }

            #resultado{
                margin-top:15px;
                font-weight:bold;
            }

            @keyframes aparecer{
                from{
                    opacity:0;
                    transform:scale(.8);
                }
                to{
                    opacity:1;
                    transform:scale(1);
                }
            }
            /*Scenario*/
            .scene-container{
                position:relative;
                width:100vw;
                height:100vh;
            }

            .scene-container img{
                width:100%;
                height:100%;
                object-fit:cover;
            }

            .zone{
                background:transparent;
                border:none;
            }

            /* Mostrar visualmente durante pruebas */
            .zone{
                border:2px solid red;
                background:rgba(255,0,0,.15);
            }
            .zone-left{
                left:0;
                top:0;

                width:20%;
                height:100%;
            }
            .zone-center{
                left:20%;
                top:0;

                width:60%;
                height:100%;
            }
            .zone-right{
                right:0;
                top:0;

                width:20%;
                height:100%;
            }
            .arrow{
                position:absolute;
                top:50%;
                transform:translateY(-50%);
                width:60px;
                height:60px;
                border-radius:50%;
                background:rgba(0,0,0,.45);
                cursor:pointer;
                z-index:100;
                transition:.2s;
            }
            .arrow:hover{
                transform:translateY(-50%) scale(1.1);
                background:rgba(0,0,0,.70);
            }
            .arrow-left{
                left:20px;
            }

            .arrow-left::before{
                content:"◀";
                color:white;
                font-size:35px;
                position:absolute;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
            }
            .arrow-right{
                right:20px;
            }

            .arrow-right::before{
                content:"▶";
                color:white;
                font-size:35px;
                position:absolute;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
            }

            .arrow-up{
                top:20px;
                left:50%;
                transform:translateX(-50%);
            }

            .arrow-up:hover{
                transform:translateX(-50%) scale(1.1);
            }

            .arrow-up::before{
                content:"▲";
                color:white;
                font-size:35px;
                position:absolute;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
            }
            .arrow-down{
                top:auto;
                bottom:20px;
                left:50%;
                transform:translateX(-50%);
            }

            .arrow-down:hover{
                transform:translateX(-50%) scale(1.1);
            }

            .arrow-down::before{
                content:"▼";
                color:white;
                font-size:35px;
                position:absolute;
                top:50%;
                left:50%;
                transform:translate(-50%,-50%);
            }
        </style>
        <meta name="viewport" content="width=device-width, initial-scale=1">
